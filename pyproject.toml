[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-calculation-report"
version = "2.0.0"
description = "A framework for executable, verifiable, and reproducible engineering calculations with interactive web visualization and formal report generation."
authors = [
    {name = "Lorenzo Pérez"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pint",
    "sympy",
    "pydantic",
    "typer",
    "rich",
    "jinja2",
    "pyyaml",
    "networkx"
]

[project.scripts]
ecr = "ecr.cli.main:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
